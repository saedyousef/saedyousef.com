<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
    <meta name="description" content="Saed Yousef portfolio focused on backend systems, integrations, infrastructure, automation, and technical leadership.">
    <title>Saed Yousef</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon-BzZNkMl0.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" crossorigin href="./assets/index-CE_p9C_s.css">
</head>
<body>
    <div class="above-fold">
        <nav class="site-nav" aria-label="Primary navigation">
            <div class="nav-left">
                <a class="nav-logo" href="#home" aria-label="Home">SY</a>
                <a class="nav-logo-text site-brand" href="#home">Saed Yousef</a>
                <div class="nav-links"></div>
            </div>
            <div class="nav-right">
                <a class="nav-login" href="#contact">
                    <span class="nav-login-full">Contact / Email</span>
                    <span class="nav-login-short">Contact</span>
                </a>
            </div>
        </nav>

        <header id="home" class="hero">
            <div class="hero-headline">
                <div class="hero-spacer"></div>
                <p class="hero-kicker"></p>
                <h1 class="hero-title"></h1>
                <p class="hero-subtitle"></p>
                <div class="hero-actions"></div>
                <div class="hero-spacer"></div>
            </div>
            <div class="term-player hero-terminal"></div>
        </header>
    </div>

    <main>
        <section id="about" class="feature-section about-section">
            <div class="feature-inner">
                <div class="section-heading"></div>
                <div class="prose-copy"></div>
            </div>
        </section>

        <section id="experience" class="feature-section experience-section">
            <div class="feature-inner">
                <div class="section-heading"></div>
                <div class="timeline"></div>
            </div>
        </section>

        <section id="education" class="feature-section education-section compact-section">
            <div class="feature-inner">
                <div class="section-heading"></div>
                <div class="card-grid"></div>
            </div>
        </section>

        <section id="skills" class="feature-section skills-section compact-section">
            <div class="feature-inner">
                <div class="section-heading"></div>
                <div class="skills-grid"></div>
            </div>
        </section>

        <section id="projects" class="feature-section projects-section">
            <div class="feature-inner">
                <div class="section-heading"></div>
                <div class="project-grid"></div>
            </div>
        </section>

        <section id="github-activity" class="feature-section github-section">
            <div class="feature-inner">
                <div class="section-heading"></div>
                <div class="github-card"></div>
            </div>
        </section>

        <section id="contact" class="feature-section contact-section">
            <div class="feature-inner contact-inner">
                <p class="contact-eyebrow"></p>
                <h2 class="contact-title"></h2>
                <p class="contact-body"></p>
                <div class="contact-actions"></div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="mobile-social footer-links" aria-label="Social links"></div>
    </footer>

</body>
</html>
